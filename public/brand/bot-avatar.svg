<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22a466"/>
      <stop offset="1" stop-color="#11683f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06331e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="320" cy="320" r="292" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <g filter="url(#sh)" transform="translate(28 22)">
    <!-- key shaft and teeth -->
    <g stroke="#ffffff" stroke-width="44" stroke-linecap="round" fill="none">
      <line x1="300" y1="300" x2="440" y2="440"/>
      <line x1="392" y1="392" x2="436" y2="348"/>
      <line x1="430" y1="430" x2="472" y2="388"/>
    </g>
    <!-- bow -->
    <circle cx="232" cy="232" r="118" fill="#ffffff"/>
    <circle cx="232" cy="232" r="78" fill="#178a52"/>
    <text x="232" y="232" text-anchor="middle" dominant-baseline="central"
          font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="118" fill="#ffffff">9</text>
  </g>
</svg>
